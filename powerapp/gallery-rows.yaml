- rowPmi:
    Control: Label@2.5.1
    Properties:
      Text: =Text(DateAdd(ThisItem.'Last PMI Date', ThisItem.'PMI Frequency (Weeks)' * 7, Days), "dd/mm/yyyy") & If(DateAdd(ThisItem.'Last PMI Date', ThisItem.'PMI Frequency (Weeks)' * 7, Days) < Today(), "  OVERDUE", "")
      X: =896
      Y: =8
      Width: =220
      Height: =28
      Size: =13
      FontWeight: =FontWeight.Bold
      Color: =If(DateAdd(ThisItem.'Last PMI Date', ThisItem.'PMI Frequency (Weeks)' * 7, Days) < Today(), RGBA(192, 57, 43, 1), If(DateAdd(ThisItem.'Last PMI Date', ThisItem.'PMI Frequency (Weeks)' * 7, Days) <= DateAdd(Today(), 14, Days), RGBA(160, 106, 0, 1), RGBA(16, 124, 16, 1)))
      Font: =Font.'Open Sans'
      Fill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      BorderColor: =RGBA(255, 255, 255, 1)
      PaddingLeft: =0
